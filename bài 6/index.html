<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        .khoi1{
            background-color: green;

        }
        .khoi2{
             background-color: yellow;
             /* 1 giá trị: cách đều xung quanh =giá trị đó */
             /* 2 giá trị: giá trị đầu (trên dưới), giá trị 2 (trái,phải) */
             /* 4 giá trị: theo thứ tự trên dưới trái phải */
             margin: 50px 200px 10px 100px;

             padding: 50px;

        }
        .khoi3{
             background-color: red;

        }
        .khoi4{
             background-color: rgb(0, 0, 255);
             display: flex;

        }
        .khoi5{
             background-color: rgb(255, 0, 162);
             width: 50px;

        }
        .khoi6{
             background-color: rgb(0, 255, 145);
             width: 50px;
        }

    </style>
</head>
<body>
    <div class="khoi1">khối 1</div>
    <div class="khoi2">khối 2</div>
    <div class="khoi3">khối 3</div>

    <div class="khoi4">
        <div class="khoi5">khối 5</div>
        <div class="khoi6">khối 6</div>
    </div>
</body>
</html>
