<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        Nhập điểm A: <input id="diemA" type="number">
    </div>
    <div>
        Nhập điểm B: <input id="diemB" type="number">
    </div>
    <div>
        Nhập điểm C: <input id="diemC" type="number">
    </div>
    <div>
        <button onclick="tinhDIemChu()">Tính điểm</button>
    </div>
    <div>
        Kết quả: <input id="KetQua" type="text">
    </div>
    <script>

    function tinhDiem() {
        var a =parseFloat(documment.getElementById("diemA").value);
        var b =parseFloat(documment.getElementById("diemB").value);
        var c =parseFloat(documment.getElementById("diemC").value);

        documment.getElementById("ketQua").value = tinhDiem(a,b,c);

    }

    function tinhDiemChu(a,b,c){
        var tong = a * 0.6 + b * 0.3 + c * 0.1
        var kq = "";
        if(tong < 4){
            kq="F";
        }
        else if(tong >=4 || tong < 5){
            kq="D"
        }
        else if(tong >=5 || tong < 7){
            kq="C"
        }
        else if(tong >=7 || tong < 8){
            kq="B"
        }
        else if(tong >=9 || tong < 10){
            kq="A"
        }
       return kq; // Trả về điểm chữ
    }


    </script> 
</body>
