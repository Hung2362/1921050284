<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 5</title>
    <link rel="stylesheet" href="style.css" tpye="text/css">
    <style>
        /* loại 2: internal style */
        h2{
            /*color dùng để qui định màu chữ*/
            color:red; 
        }
        #tieude{
            color:aquamarine;
        }

    </style>
</head>
<body>
    <!-- I selector-->
    <!--kiểu 1 style trong thẻ-->
    <!--loại 1: inline style-->

    <h1 style="color:blue">HUMG</h1>
    <!--kiểu 2-->
    <h2>Trường đại học mỏ địa chất</h2>
    <h3>Lớp phát triển ứng dụng web</h3>

    <!-- II selector -->
    <!-- cách 1: Dùng tên thẻ -->
    <!--cách 2: Dùng ID (viết dấu # trước tên id)-->
    <h2 id="tieude">Trường đại học mỏ địa chất</h2>
    <!--cách 3 class (viết dấu . trước tên class)-->
    <h2 id="tieude" class="tieude">Trường đại học mỏ địa chất</h2>
    <h3 class="tieude2">Lớp phát triển ứng dụng web</h3>





</body>
</html>
